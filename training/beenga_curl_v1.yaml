---
# Beenga Image — curl_type LoRA, run 1.
#
# Target defect: IND-MULTI-001. "soft loose salon curls" survives on its own but
# collapses into tight ringlets once other attributes compete for attention.
# Measured 2/3 after the prompt-layer fixes, so this is the residue that
# prompting could not reach.
#
# Trained on the UNDISTILLED base. The distilled 4-step checkpoint is what serves
# traffic; the base is what you fine-tune.
#
# Dataset is 200 Z-Image generations, uncurated. Run 1 is a pipeline proof — if
# the benchmark moves, curate and run again for quality.
job: extension
config:
  name: "beenga_curl_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/output"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 3
      datasets:
        - folder_path: "/workspace/train"
          caption_ext: "txt"
          # A little caption dropout stops the LoRA welding itself to the exact
          # sentence template every caption shares — we want the curl vocabulary
          # to generalise, not the boilerplate around it.
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "flux2_klein_4b"
        # 46GB card, but the VLM text encoder is the memory hog here, not the
        # 4B transformer. Quantise and keep headroom.
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        width: 1024
        height: 1024
        # These are lifted from the benchmark so the intermediate samples are
        # directly comparable to what we are trying to fix — including the
        # multi-attribute case that is the actual target.
        prompts:
          - "an Indian woman with soft loose salon curls, beauty-parlour blowout curls, 27-year-old, wheatish medium-brown skin, wearing a formal office blouse, in an open-plan office, realistic photography"
          - "A 25-year-old Indian woman standing on a clean modern apartment rooftop at sunset, long dense softly curled black hair styled in loose salon curls, subtle kajal, contemporary blue sari with a sleeveless blouse, casually dancing with one hand raised, realistic photography"
          - "an Indian woman with soft loose salon curls, deep brown skin with warm undertones, 36-year-old, wearing a plain cotton kurti, on a residential street, realistic photography"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "beenga_curl_v1"
  version: '1.0'
