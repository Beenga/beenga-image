# Beenga Image — Cog build for Replicate.
#
#   cog push r8.im/beenga/beenga-image-1
#
# Needs a machine with Docker and ~60GB free. Building does not need a GPU, but
# the CUDA base image and torch wheels are large.
#
# Weights are NOT baked into the image. They download at first boot into the
# cache directory, which keeps the image small enough to push over a normal
# connection and means a rebuild does not re-upload 15GB of checkpoint.
build:
  gpu: true
  cuda: "12.8"
  python_version: "3.11"
  python_packages:
    - "torch==2.11.0"
    - "torchvision"
    - "torchaudio"
    - "diffusers>=0.36"
    - "transformers>=4.48"
    - "accelerate"
    - "safetensors"
    - "sentencepiece"
    - "protobuf"
    - "peft"
    - "pillow"
  run:
    # Bake the checkpoint into the image. The first build left it to download at
    # boot to keep the push small — and the very first prediction then sat in
    # `starting` for over twenty minutes pulling ~15GB. Replicate scales public
    # models to zero, so that cost would be paid on every cold start, by users.
    # A one-off larger push is the right trade.
    - "mkdir -p /src/model-cache /src/loras"
    - "pip install --no-cache-dir huggingface_hub"
    - "python3 -c \"from huggingface_hub import snapshot_download; snapshot_download('black-forest-labs/FLUX.2-klein-4B', cache_dir='/src/model-cache')\""
    # Cog's base setup symlinks `python3` but not `python`, then its own
    # post-build step runs `python -m pip freeze` and dies with
    # "exec python failed: No such file or directory" — after the image has
    # already built and exported successfully, which makes it look like a build
    # failure when it is a packaging-step failure.
    - "ln -sf $(command -v python3) /usr/local/bin/python"

predict: "predict.py:Predictor"

image: "r8.im/beenga/beenga-image-1"
