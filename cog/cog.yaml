# Beenga Image — Cog build for Replicate.
#
#   cog push r8.im/beenga/beenga-image-1
#
# Needs a machine with Docker and ~60GB free. Building does not need a GPU, but
# the CUDA base image and torch wheels are large.
#
# Weights ARE baked into the image, via snapshot_download in the run block
# below and pushed with --separate-weights. Downloading at first boot was tried
# and abandoned — see the comment on that step for why.
build:
  gpu: true
  # 12.4, NOT 12.8. cog maps 12.8 to nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04,
  # and Ubuntu 24.04 enforces PEP 668 — the system Python is marked externally
  # managed. That single fact broke two separate builds in different places:
  # cog 0.21 died at build time on `uv run pip install`, and cog 0.22 built fine
  # but Replicate's runtime dependency step was refused at container setup.
  # CUDA 12.4 maps to an Ubuntu 22.04 base, which does not enforce it.
  cuda: "12.4"
  python_version: "3.11"
  python_packages:
    - "torch==2.6.0"
    - "torchvision"
    - "torchaudio"
    - "diffusers>=0.36"
    - "transformers>=4.48"
    - "accelerate"
    - "safetensors"
    - "sentencepiece"
    - "protobuf"
    - "peft"
    - "pillow"
  run:
    # Weights ARE baked in, pushed via --separate-weights so they land in their
    # own cached layer rather than bloating the code layers.
    #
    # Downloading 15GB at every cold boot is fragile, and it failed in practice:
    # "RemoteProtocolError: peer closed connection without sending complete
    # message body" partway through. Baking them in removes the network from the
    # boot path entirely.
    #
    # An earlier attempt at this produced a ~70GB image that could not unpack on
    # a 155GB builder. The fix is a bigger builder and --separate-weights, not
    # abandoning the approach.
    - "mkdir -p /src/model-cache /src/loras"
    # Pinned by revision, not by tag. Without this every rebuild pulls whatever
    # is at main, so an upstream weight update would silently change the model
    # and nothing would record which build shipped which weights. The pin makes
    # a rebuild reproducible and makes an upstream change a visible decision.
    #
    # e7b7dc2 = the revision this project was built and benchmarked against,
    # last modified 2026-02-24. Bump deliberately, then re-run the benchmarks —
    # every measurement in MODEL_CARD.md is against this revision.
    #
    # Downloads from OUR MIRROR, not from Black Forest Labs.
    #
    # That is the entire point of the mirror and it was missed at first: the
    # weights are baked into the pushed image, so a RUNNING model survives BFL
    # withdrawing, gating or renaming their repo — but a REBUILD would have
    # failed here, because this line pointed upstream. A mirror nothing builds
    # from protects nothing. Any bug fix or fine-tune needing a rebuild would
    # have been blocked with a full copy of the weights sitting unused.
    #
    # beenga8/flux2-klein-4b-mirror is a byte-for-byte copy of
    # black-forest-labs/FLUX.2-klein-4B@e7b7dc27, verified file-by-file against
    # the source. Apache 2.0 permits the copy. Pinned to the mirror's own commit
    # so a rebuild is reproducible against something we control end to end.
    - "python3 -c \"from huggingface_hub import snapshot_download; snapshot_download('beenga8/flux2-klein-4b-mirror', revision='dee36d946f5caa6644e03246f07f08288656a4c0', cache_dir='/src/model-cache')\""

predict: "predict.py:Predictor"

image: "r8.im/beenga/beenga-image-1"
