# Beenga Image — Cog build for Replicate.
#
#   cog push r8.im/beenga/beenga-image-1
#
# Needs a machine with Docker and ~60GB free. Building does not need a GPU, but
# the CUDA base image and torch wheels are large.
#
# Weights ARE baked into the image, via snapshot_download in the run block
# below and pushed with --separate-weights. Downloading at first boot was tried
# and abandoned — see the comment on that step for why.
build:
  gpu: true
  # 12.4, NOT 12.8. cog maps 12.8 to nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04,
  # and Ubuntu 24.04 enforces PEP 668 — the system Python is marked externally
  # managed. That single fact broke two separate builds in different places:
  # cog 0.21 died at build time on `uv run pip install`, and cog 0.22 built fine
  # but Replicate's runtime dependency step was refused at container setup.
  # CUDA 12.4 maps to an Ubuntu 22.04 base, which does not enforce it.
  cuda: "12.4"
  python_version: "3.11"
  python_packages:
    - "torch==2.6.0"
    - "torchvision"
    - "torchaudio"
    - "diffusers>=0.36"
    - "transformers>=4.48"
    - "accelerate"
    - "safetensors"
    - "sentencepiece"
    - "protobuf"
    - "peft"
    - "pillow"
  run:
    # Weights ARE baked in, pushed via --separate-weights so they land in their
    # own cached layer rather than bloating the code layers.
    #
    # Downloading 15GB at every cold boot is fragile, and it failed in practice:
    # "RemoteProtocolError: peer closed connection without sending complete
    # message body" partway through. Baking them in removes the network from the
    # boot path entirely.
    #
    # An earlier attempt at this produced a ~70GB image that could not unpack on
    # a 155GB builder. The fix is a bigger builder and --separate-weights, not
    # abandoning the approach.
    - "mkdir -p /src/model-cache /src/loras"
    - "python3 -c \"from huggingface_hub import snapshot_download; snapshot_download('black-forest-labs/FLUX.2-klein-4B', cache_dir='/src/model-cache')\""

predict: "predict.py:Predictor"

image: "r8.im/beenga/beenga-image-1"
