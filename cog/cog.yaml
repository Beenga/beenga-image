# Beenga Image — Cog build for Replicate.
#
#   cog push r8.im/beenga/beenga-image-1
#
# Needs a machine with Docker and ~60GB free. Building does not need a GPU, but
# the CUDA base image and torch wheels are large.
#
# Weights are NOT baked into the image. They download at first boot into the
# cache directory, which keeps the image small enough to push over a normal
# connection and means a rebuild does not re-upload 15GB of checkpoint.
build:
  gpu: true
  # 12.4, NOT 12.8. cog maps 12.8 to nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04,
  # and Ubuntu 24.04 enforces PEP 668 — the system Python is marked externally
  # managed. That single fact broke two separate builds in different places:
  # cog 0.21 died at build time on `uv run pip install`, and cog 0.22 built fine
  # but Replicate's runtime dependency step was refused at container setup.
  # CUDA 12.4 maps to an Ubuntu 22.04 base, which does not enforce it.
  cuda: "12.4"
  python_version: "3.11"
  python_packages:
    - "torch==2.6.0"
    - "torchvision"
    - "torchaudio"
    - "diffusers>=0.36"
    - "transformers>=4.48"
    - "accelerate"
    - "safetensors"
    - "sentencepiece"
    - "protobuf"
    - "peft"
    - "pillow"
  run:
    # Weights are NOT baked in. They were, briefly: the first prediction sat in
    # `starting` for twenty minutes and I read that as a slow boot download. It
    # was not — setup was crashing on PEP 668, fixed by the CUDA 12.4 base above.
    # Baking 15GB in produced a ~70GB image that then failed to unpack on a
    # 155GB builder, so the change solved nothing and broke the build.
    # Weights download once per machine and Replicate caches them.
    - "mkdir -p /src/model-cache /src/loras"

predict: "predict.py:Predictor"

image: "r8.im/beenga/beenga-image-1"
